    /* =========================
       Luxury Dark Minimal Theme
    ========================= */
    :root {
      --bg: #060709;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-hover: rgba(255, 255, 255, 0.06);
      --gold: #d4af37;
      --gold-light: #f3e5ab;
      --text: #f5f5f7;
      --muted: #9e9ea7;
      --border: rgba(255, 255, 255, 0.08);
      --border-gold: rgba(212, 175, 55, 0.25);
      --font-en: 'Cinzel', serif;
      --font-zh: 'Noto Sans TC', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: var(--font-zh); background-color: var(--bg); color: var(--text); line-height: 1.7; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .container { width: min(1120px, 88%); margin: 0 auto; }
    .section { padding: 100px 0; }

    /* Header Navigation */
    header { position: fixed; top: 0; left: 0; width: 100%; z-index: 100; transition: all 0.4s ease; }
    header.scrolled { background: rgba(6, 7, 9, 0.88); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); }
    .nav { height: 80px; display: flex; align-items: center; justify-content: space-between; }

    .nav-links a:hover { color: #fff; }
    .btn-nav { padding: 8px 20px; border: 1px solid var(--gold); border-radius: 40px; color: var(--gold) !important; background: rgba(212, 175, 55, 0.05); transition: 0.3s; }
    .btn-nav:hover { background: var(--gold); color: #000 !important; }

    /* Hero Section */
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      padding: 120px 0 80px;
      background: linear-gradient(180deg, rgba(6,7,9,0.3) 0%, rgba(6,7,9,0.96) 100%),

    }
    .hero-title { font-family: var(--font-en); font-size: clamp(52px, 9vw, 96px); letter-spacing: 12px; font-weight: 800; line-height: 1.1; margin-bottom: 8px; color: #fff; }
    .hero-sub { font-size: clamp(18px, 3.5vw, 26px); letter-spacing: 6px; color: var(--gold); font-weight: 300; margin-bottom: 24px; }

    .cta-group { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin-bottom: 40px; }

    .btn-gold { background: var(--gold); color: #000; font-weight: 700; box-shadow: 0 4px 20px rgba(212, 175, 55, 0.25); }
    .btn-gold:hover { background: var(--gold-light); transform: translateY(-2px); }
    .btn-glass { background: var(--card-bg); border-color: var(--border); color: var(--text); backdrop-filter: blur(10px); }
    .btn-glass:hover { background: var(--card-hover); border-color: rgba(255,255,255,0.2); transform: translateY(-2px); }

    /* Info Grid */
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .info-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 40px; display: flex; flex-direction: column; justify-content: space-between; }

    .hours-list { list-style: none; color: var(--muted); font-size: 14px; margin-top: 10px; }
    .hours-list li { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }

    /* FAQ */
    .faq-list { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
    details { padding: 20px 28px; border-radius: 14px; background: var(--card-bg); border: 1px solid var(--border); }
    details[open] { border-color: var(--border-gold); }
    summary { cursor: pointer; font-size: 16px; font-weight: 700; list-style: none; display: flex; justify-content: space-between; align-items: center; color: #fff; }
    summary::after { content: "+"; color: var(--gold); font-size: 22px; }
    details[open] summary::after { content: "−"; }
    details p { color: var(--muted); padding-top: 12px; font-size: 14px; font-weight: 300; line-height: 1.6; }

    /* Footer */
    footer { border-top: 1px solid var(--border); padding: 60px 0 110px; text-align: center; color: var(--muted); font-size: 13px; }
    .footer-brand { font-family: var(--font-en); font-size: 22px; color: #fff; margin-bottom: 12px; letter-spacing: 3px; }

    /* Mobile Floating Bar */
    .mobile-bar {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 4%;
      right: 4%;
      z-index: 100;
      background: rgba(18, 20, 26, 0.92);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-gold);
      border-radius: 40px;
      padding: 6px;
      grid-template-columns: repeat(3, 1fr);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }
    .mobile-bar a { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px 0; font-size: 12px; color: var(--muted); font-weight: 500; }
    .mobile-bar a.main-btn { background: var(--gold); color: #000; border-radius: 30px; font-weight: 700; }

    /* 📱 手機介面自適應 */
    @media (max-width: 768px) {
      .nav-links { display: none; }
      .mobile-bar { display: grid; }
      body { padding-bottom: 80px; }

      .hero { min-height: 85vh; padding: 100px 0 60px; }
      .hero-title { font-size: 42px; letter-spacing: 6px; }
      .hero-sub { font-size: 18px; letter-spacing: 3px; }

      .feature-grid, .about-grid, .info-grid { grid-template-columns: 1fr; gap: 24px; }
      .about-img { height: 300px; }
      .event-card { flex-direction: column; text-align: center; }

      .gallery-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .gallery-item { height: 200px; }
      .section { padding: 60px 0; }
    }
